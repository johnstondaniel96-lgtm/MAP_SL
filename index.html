<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sri Lanka trip map v1.0</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EE; --panel:#FFFFFF; --panel2:#F5F7F5; --ink:#16231C; --muted:#5A6A61; --line:#D7DED9;
  --tea:#1F5A43; --good:#2E8B57; --mixed:#D49B1A; --wet:#2F6A93; --dry:#E0A526;
  --focus:#1F5A43; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#101713;--panel:#17201B;--panel2:#1D2822;--ink:#E6ECE8;--muted:#9AABA1;--line:#2C3A33;
  --tea:#6FC39A;--good:#5CC08A;--mixed:#E9B949;--wet:#6FA8D6;--dry:#E9B949;--focus:#6FC39A;color-scheme:dark;}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.app{display:grid;grid-template-columns:400px 1fr;height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
#map{height:100%;width:100%}
header.top{padding:20px 20px 14px;border-bottom:1px solid var(--line)}
h1{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:26px;line-height:1.15;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0}
.totals{display:flex;gap:10px;margin-top:14px}
.tot{flex:1;background:var(--panel2);border-radius:10px;padding:8px 10px}
.tot b{display:block;font-size:20px;font-weight:600}
.tot span{font-size:12px;color:var(--muted)}
.tot.ok b{color:var(--good)} .tot.warn b{color:var(--mixed)}
section{padding:14px 20px;border-bottom:1px solid var(--line)}
h2{font-size:14px;font-weight:600;margin:0 0 10px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:13px;padding:7px 4px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--tea);color:#fff}
@media (prefers-color-scheme:dark){.seg button[aria-pressed="true"]{color:#0E1511}}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;border:3px solid;vertical-align:-1px;margin-right:4px;background:var(--panel)}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:13px}
.checks label{display:flex;gap:6px;align-items:center;cursor:pointer}
.zone{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--panel)}
.zone.off{opacity:.55}
.zone.dragover{outline:2px dashed var(--tea)}
.zhead{display:flex;align-items:center;gap:8px;padding:8px 10px}
.grip{cursor:grab;color:var(--muted);font-size:16px;user-select:none;padding:0 2px}
.seq{width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.zname{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:inherit;font-weight:600;text-align:left;cursor:pointer;padding:0}
.zname small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.nights{display:flex;align-items:center;gap:2px}
.nights button,.mv button,.iconbtn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);width:24px;height:24px;border-radius:6px;cursor:pointer;font:inherit;line-height:1;padding:0}
.nights output{min-width:26px;text-align:center;font-weight:600}
.mv{display:flex;flex-direction:column;gap:2px}
.mv button{height:15px;width:20px;font-size:9px}
.zbody{padding:0 12px 12px 12px;font-size:13px;display:none}
.zone.open .zbody{display:block}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:20px;margin-right:4px;border:1px solid}
.pill.g{color:var(--good);border-color:var(--good)} .pill.m{color:var(--mixed);border-color:var(--mixed)} .pill.w{color:var(--wet);border-color:var(--wet)}
table.sl{width:100%;border-collapse:collapse;margin-top:8px}
table.sl td{padding:4px 4px;border-top:1px solid var(--line);vertical-align:top}
table.sl td:nth-child(2),table.sl td:nth-child(3){white-space:nowrap;color:var(--muted);text-align:right}
table.sl button{background:none;border:0;color:var(--ink);font:inherit;text-align:left;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.leg{font-size:12.5px;border-left:3px solid var(--line);padding:4px 0 4px 10px;margin:6px 0 0}
.leg b{font-weight:600}
.legs .leg{margin:0 0 8px}
footer.tools{padding:14px 20px 24px;display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:inherit;font-size:13px;padding:7px 12px;border-radius:8px;cursor:pointer}
.btn.primary{background:var(--tea);border-color:var(--tea);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#0E1511}}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.hubicon{border-radius:50%;color:#fff;font:700 12px/1 "Instrument Sans",sans-serif;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.hubicon.off{background:#9aa8a0!important;opacity:.8}
.leaflet-popup-content{font:13px/1.45 "Instrument Sans",system-ui,sans-serif;margin:12px 14px}
.leaflet-popup-content h3{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:17px;margin:0 0 4px}
.leaflet-popup-content p{margin:4px 0}
.pp-muted{color:#5A6A61}
.mlabel{background:transparent;border:0;box-shadow:none;font:600 12px "Instrument Sans",sans-serif;color:#16231C;text-shadow:0 0 3px #fff,0 0 3px #fff}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto}
  #mapwrap{order:-1;height:55vh;position:sticky;top:0;z-index:5}
  aside{border-right:0;overflow:visible}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<!--
=====================================================================
  HOW TO EDIT THIS MAP
  All trip content lives in the TRIP object inside the <script> below.
  - zones:  accommodation bases. Change nights, colour, included (true/false),
            or delete a whole zone object. Order in the list = default itinerary order.
  - sights: places of interest. "zone" links a sight to a base.
            fee: null until verified, then e.g. fee:{gbp:28, usd:35, source:"...", url:"...", checked:"2027-02-01"}
  - legs:   travel between bases (either direction). cost: null until verified.
  Changes made in the side panel (order, nights, on/off) are saved in this
  browser. Use "Export plan" to keep a copy; "Reset" returns to the file defaults.
=====================================================================
-->
<div class="app">
  <aside aria-label="Trip planner">
    <header class="top">
      <h1>Sri Lanka, early 2028</h1>
      <p class="sub">2 adults, 14–15 nights. Map v1.0 – overview and draft bases for review.</p>
      <div class="totals">
        <div class="tot" id="totNights"><b>0</b><span>nights planned</span></div>
        <div class="tot"><b id="totZones">0</b><span>bases included</span></div>
        <div class="tot"><b id="totCost">–</b><span id="totCostLbl">verified costs</span></div>
      </div>
    </header>

    <section aria-labelledby="h-season">
      <h2 id="h-season">Weather view</h2>
      <div class="seg" role="group" aria-label="Month">
        <button data-month="jan">Jan</button><button data-month="feb">Feb</button><button data-month="mar">Mar</button><button data-month="maysep">May–Sep</button>
      </div>
      <div class="legend">
        <span><i class="dot" style="border-color:var(--good)"></i>Good</span>
        <span><i class="dot" style="border-color:var(--mixed)"></i>Mixed</span>
        <span><i class="dot" style="border-color:var(--wet)"></i>Wet</span>
      </div>
      <p class="note" id="seasonNote"></p>
    </section>

    <section aria-labelledby="h-layers">
      <h2 id="h-layers">Show on map</h2>
      <div class="checks" id="layerChecks"></div>
    </section>

    <section aria-labelledby="h-zones">
      <h2 id="h-zones">Bases (drag or use arrows to reorder)</h2>
      <div id="zoneList"></div>
    </section>

    <section aria-labelledby="h-legs" class="legs">
      <h2 id="h-legs">Travel between bases</h2>
      <div id="legList"></div>
    </section>

    <footer class="tools">
      <button class="btn primary" id="btnExport">Export plan</button>
      <button class="btn" id="btnImport">Import plan</button>
      <button class="btn" id="btnFit">Fit map to plan</button>
      <button class="btn" id="btnReset">Reset to defaults</button>
      <input type="file" id="fileIn" accept="application/json" hidden>
    </footer>
  </aside>
  <div id="mapwrap"><div id="map" role="application" aria-label="Map of Sri Lanka"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

map.createPane("outline"); map.getPane("outline").style.zIndex = 250;
const outlineLayer = L.geoJSON(LKA_OUTLINE,{pane:"outline",interactive:false,style:()=>({color:"#7A8C80",weight:1,fillColor:"#E4E9E3",fillOpacity:1})});
const base = {
  "Street map (CARTO)": L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",{maxZoom:19,subdomains:"abcd",attribution:"&copy; OpenStreetMap contributors &copy; CARTO"}),
  "Light (CARTO)": L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",{maxZoom:19,subdomains:"abcd",attribution:"&copy; OpenStreetMap contributors &copy; CARTO"}),
  "Terrain (OpenTopoMap)": L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",{maxZoom:17,attribution:"&copy; OpenStreetMap contributors, SRTM | &copy; OpenTopoMap (CC-BY-SA)"}),
  "OpenStreetMap (hosted file only)": L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap contributors"}),
  "Offline outline": outlineLayer
};
const BASE_KEY = "lk-trip-basemap";
let baseName = "Street map (CARTO)";
try { const b = localStorage.getItem(BASE_KEY); if (b && base[b]) baseName = b; } catch(e){}
function setMapBg(name){ document.getElementById("map").style.background = name==="Offline outline" ? "#CFE0EA" : ""; }
base[baseName].addTo(map); setMapBg(baseName);
map.on("baselayerchange",e=>{ baseName=e.name; setMapBg(e.name); try{ localStorage.setItem(BASE_KEY,e.name); }catch(err){} });
// automatic fallback if a tile provider fails to load
Object.entries(base).forEach(([name,layer])=>{
  if(!layer.on || name==="Offline outline") return;
  let errs=0;
  layer.on("tileerror",()=>{ if(++errs===6 && map.hasLayer(layer)){ map.removeLayer(layer); outlineLayer.addTo(map); baseName="Offline outline"; setMapBg(baseName);
    L.popup().setLatLng(map.getCenter()).setContent(`${name} could not load, so the map has switched to the offline outline. Try another option in the layer menu (top right).`).openOn(map); }});
  layer.on("tileload",()=>{ errs=0; });
});
L.control.layers(base,null,{position:"topright"}).addTo(map);
L.control.scale({imperial:false}).addTo(map);

const overlayLayer = L.layerGroup().addTo(map);
const routeLayer = L.layerGroup().addTo(map);
const sightLayer = L.layerGroup().addTo(map);
const hubLayer = L.layerGroup().addTo(map);
const sightMarkers = {};

function drawOverlay(){
  overlayLayer.clearLayers();
  if(!state.overlay) return;
  const m = state.month, summer = m==="maysep";
  const neOp = {jan:.30,feb:.18,mar:.08,maysep:0}[m];
  const swOp = summer ? .30 : 0;
  const wet = cssVar("--wet"), dry = cssVar("--dry");
  L.polygon(SW_POLY,{stroke:false,fillColor: summer?wet:dry, fillOpacity: summer?swOp:.08, interactive:false}).addTo(overlayLayer);
  L.polygon(NE_POLY,{stroke:false,fillColor: summer?dry:wet, fillOpacity: summer?.08:neOp, interactive:false}).addTo(overlayLayer);
  L.polyline(DIVIDE,{color:wet,weight:2,dashArray:"6 6",opacity:.9})
    .bindTooltip("Approximate monsoon divide (central highlands)",{sticky:true}).addTo(overlayLayer);
  L.marker([6.55,79.75],{icon:L.divIcon({className:"mlabel",html:"SW monsoon side<br>wet May–Sep",iconSize:[130,30]}),interactive:false}).addTo(overlayLayer);
  L.marker([8.95,81.15],{icon:L.divIcon({className:"mlabel",html:"NE monsoon side<br>wet Nov–Jan",iconSize:[130,30]}),interactive:false}).addTo(overlayLayer);
}

function feeText(s){
  if(!s.fee) return `<span class="pp-muted">Entry: to verify (source: ${s.feeSource||"tbc"})</span>`;
  const f=s.fee; const parts=[];
  if(f.gbp!=null) parts.push("£"+f.gbp); if(f.usd!=null) parts.push("US$"+f.usd); if(f.lkr!=null) parts.push("LKR "+f.lkr);
  return `Entry: ${parts.join(" / ")} per adult${f.url?` (<a href="${f.url}" target="_blank" rel="noopener">${f.source||"source"}</a>`:` (${f.source||""}`}${f.checked?", checked "+f.checked:""})`;
}
function sightPopup(s){
  const z=Z[s.zone], r=ratingOf(s);
  return `<h3>${s.name}</h3>
  <p class="pp-muted">${CATS[s.cat]} in ${z.name}${state.included[z.id]?"":" (base not in plan)"}</p>
  <p>From base: <b>${s.fromHub||"–"}</b>${s.visit?` &nbsp; Allow: <b>${s.visit}</b>`:""}</p>
  <p>${MONTHS[state.month]}: <span class="pill ${r}">${RATING[r]}</span></p>
  ${s.note?`<p>${s.note}</p>`:""}
  <p>${feeText(s)}</p>`;
}
function drawSights(){
  sightLayer.clearLayers();
  TRIP.sights.forEach(s=>{
    const inc = state.included[s.zone];
    if(!inc && !state.showExcluded) return;
    if(!state.cats[s.cat]) return;
    const r = ratingOf(s);
    const mk = L.circleMarker([s.lat,s.lng],{radius:s.cat==="transport"?5:7,color:ratingColor(r),weight:3,
      fillColor:Z[s.zone].color,fillOpacity:inc?.95:.35,opacity:inc?1:.45})
      .bindPopup(()=>sightPopup(s),{maxWidth:300}).bindTooltip(s.name,{direction:"top",offset:[0,-6]});
    mk.addTo(sightLayer); sightMarkers[s.id]=mk;
  });
}
function drawHubs(){
  hubLayer.clearLayers(); routeLayer.clearLayers();
  const seq = includedOrder();
  TRIP.zones.forEach(z=>{
    const i = seq.indexOf(z.id), on = i>-1;
    const html = `<div class="hubicon ${on?"":"off"}" style="background:${z.color};width:${on?28:20}px;height:${on?28:20}px">${on?i+1:""}</div>`;
    L.marker([z.lat,z.lng],{icon:L.divIcon({className:"",html,iconSize:on?[28,28]:[20,20],iconAnchor:on?[14,14]:[10,10]}),zIndexOffset:on?1000:500})
      .bindTooltip(`${on?(i+1)+". ":""}${z.name}${on?` – ${state.nights[z.id]} night${state.nights[z.id]===1?"":"s"}`:" (not in plan)"}`,{direction:"right",offset:[14,0]})
      .on("click",()=>openZone(z.id,true)).addTo(hubLayer);
  });
  if(!state.route || !seq.length) return;
  const pts = [[TRIP.airport.lat,TRIP.airport.lng], ...seq.map(id=>[Z[id].lat,Z[id].lng]), [TRIP.airport.lat,TRIP.airport.lng]];
  L.polyline(pts,{color:cssVar("--tea"),weight:3,opacity:.75,dashArray:"2 8",lineCap:"round"}).addTo(routeLayer);
  L.marker([TRIP.airport.lat,TRIP.airport.lng],{icon:L.divIcon({className:"",html:`<div class="hubicon" style="background:#16231C;width:24px;height:24px">✈</div>`,iconSize:[24,24],iconAnchor:[12,12]})})
    .bindTooltip(TRIP.airport.name,{direction:"right",offset:[12,0]}).addTo(routeLayer);
}

/* ===== side panel ===== */
const $ = (s)=>document.querySelector(s);
function renderTotals(){
  const seq = includedOrder();
  const n = seq.reduce((t,id)=>t+state.nights[id],0);
  const box = $("#totNights"); box.querySelector("b").textContent = n;
  box.className = "tot " + (n>=TRIP.target.min && n<=TRIP.target.max ? "ok" : "warn");
  box.querySelector("span").textContent = `nights (target ${TRIP.target.min}–${TRIP.target.max})`;
  $("#totZones").textContent = seq.length;
  // verified costs only
  let gbp=0, pending=0;
  TRIP.sights.filter(s=>state.included[s.zone]).forEach(s=>{ if(s.fee&&s.fee.gbp!=null) gbp+=s.fee.gbp*2; else if(s.fee===null) pending++; });
  $("#totCost").textContent = gbp ? "£"+gbp.toLocaleString("en-GB") : "–";
  $("#totCostLbl").textContent = `verified, ${pending} items to price`;
}
function renderSeason(){
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.month===state.month));
  $("#seasonNote").textContent = SEASON_TXT[state.month];
}
function renderLayerChecks(){
  const items = [["overlay","Monsoon overlay"],["route","Route line"],["showExcluded","Sights in other bases"]]
    .map(([k,l])=>`<label><input type="checkbox" data-k="${k}" ${state[k]?"checked":""}>${l}</label>`)
    .concat(Object.entries(CATS).map(([c,l])=>`<label><input type="checkbox" data-cat="${c}" ${state.cats[c]?"checked":""}>${l}</label>`));
  $("#layerChecks").innerHTML = items.join("");
}
function legHtml(a,b,label){
  const l = findLeg(a==="AIR"?"NEG":a, b==="AIR"?"NEG":b);
  const opts = l.options.map(o=>`<b>${o.mode}</b> ${o.time}${o.note?` – ${o.note}`:""}`).join("<br>");
  return `<div class="leg" style="border-left-color:${l.missing?cssVar("--mixed"):cssVar("--line")}"><div>${label}</div>${opts}<div class="pp-muted">${l.cost?"Cost: "+l.cost:"Cost: to verify"}</div></div>`;
}
function renderZones(){
  const seq = includedOrder();
  $("#zoneList").innerHTML = state.order.map(id=>{
    const z=Z[id], on=state.included[id], i=seq.indexOf(id), r=z.season[state.month];
    const sights = TRIP.sights.filter(s=>s.zone===id);
    const rows = sights.map(s=>`<tr><td><button data-sight="${s.id}">${s.name}</button></td><td>${s.fromHub||""}</td><td><span class="pill ${ratingOf(s)}" title="${MONTHS[state.month]}">${RATING[ratingOf(s)]}</span></td></tr>`).join("");
    const next = on && i<seq.length-1 ? legHtml(id,seq[i+1],`Next: to ${Z[seq[i+1]].name}`) : (on && i===seq.length-1 && id!=="NEG" ? legHtml(id,"AIR","Next: to the airport") : "");
    return `<div class="zone ${on?"":"off"} ${state.open[id]?"open":""}" data-id="${id}" draggable="true">
      <div class="zhead">
        <span class="grip" aria-hidden="true" title="Drag to reorder">⋮⋮</span>
        <div class="mv"><button data-up="${id}" aria-label="Move ${z.name} up">▲</button><button data-down="${id}" aria-label="Move ${z.name} down">▼</button></div>
        <input type="checkbox" data-inc="${id}" ${on?"checked":""} aria-label="Include ${z.name}">
        <span class="seq" style="background:${z.color}">${on?i+1:"–"}</span>
        <button class="zname" data-open="${id}" aria-expanded="${!!state.open[id]}">${z.name}<small>${z.hub}, ${sights.length} sights</small></button>
        <div class="nights" aria-label="Nights"><button data-n="${id}" data-d="-1" aria-label="One night fewer">−</button><output>${state.nights[id]}</output><button data-n="${id}" data-d="1" aria-label="One night more">+</button></div>
      </div>
      <div class="zbody">
        <p><span class="pill ${r}">${MONTHS[state.month]}: ${RATING[r]}</span></p>
        <p class="note">${z.note}</p>
        <table class="sl"><tbody>${rows}</tbody></table>
        ${next}
      </div></div>`;
  }).join("");
}
function renderLegs(){
  const seq = includedOrder();
  if(!seq.length){ $("#legList").innerHTML = `<p class="note">Tick at least one base to build a route.</p>`; return; }
  const stops = ["AIR",...seq,"AIR"];
  const name = (id)=> id==="AIR" ? "Airport" : Z[id].name;
  let html="";
  for(let i=0;i<stops.length-1;i++){
    const a=stops[i], b=stops[i+1];
    if((a==="AIR"&&b==="NEG")||(a==="NEG"&&b==="AIR")){ html+=`<div class="leg"><div>${name(a)} → ${name(b)}</div><b>Private car</b> 20–30 min<div class="pp-muted">Cost: to verify</div></div>`; continue; }
    html += legHtml(a,b,`${name(a)} → ${name(b)}`);
  }
  $("#legList").innerHTML = html;
}
function renderAll(){ renderTotals(); renderSeason(); renderLayerChecks(); renderZones(); renderLegs(); drawOverlay(); drawSights(); drawHubs(); save(); }

function openZone(id,fly){
  state.open[id]=true; renderZones(); save();
  if(fly){ const pts = TRIP.sights.filter(s=>s.zone===id).map(s=>[s.lat,s.lng]).concat([[Z[id].lat,Z[id].lng]]);
    map.fitBounds(L.latLngBounds(pts).pad(0.25),{maxZoom:12}); }
  const el = document.querySelector(`.zone[data-id="${id}"]`); if(el) el.scrollIntoView({block:"nearest"});
}
function move(id,dir){ const i=state.order.indexOf(id), j=i+dir; if(j<0||j>=state.order.length) return; [state.order[i],state.order[j]]=[state.order[j],state.order[i]]; renderAll(); }

/* ===== events ===== */
document.querySelector(".seg").addEventListener("click",e=>{ const m=e.target.dataset.month; if(m){ state.month=m; renderAll(); }});
$("#layerChecks").addEventListener("change",e=>{ const t=e.target; if(t.dataset.k) state[t.dataset.k]=t.checked; if(t.dataset.cat) state.cats[t.dataset.cat]=t.checked; renderAll(); });
$("#zoneList").addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.open){ const id=t.dataset.open; state.open[id]=!state.open[id]; renderZones(); save(); if(state.open[id]) openZone(id,true); }
  else if(t.dataset.n){ const id=t.dataset.n; state.nights[id]=Math.max(0,state.nights[id]+Number(t.dataset.d)); renderAll(); }
  else if(t.dataset.up) move(t.dataset.up,-1);
  else if(t.dataset.down) move(t.dataset.down,1);
  else if(t.dataset.sight){ const s=TRIP.sights.find(x=>x.id===t.dataset.sight); map.setView([s.lat,s.lng],13); const mk=sightMarkers[s.id]; if(mk&&sightLayer.hasLayer(mk)) mk.openPopup(); }
});
$("#zoneList").addEventListener("change",e=>{ const id=e.target.dataset.inc; if(id){ state.included[id]=e.target.checked; renderAll(); }});
let dragId=null;
$("#zoneList").addEventListener("dragstart",e=>{ const z=e.target.closest(".zone"); if(z){ dragId=z.dataset.id; e.dataTransfer.effectAllowed="move"; }});
$("#zoneList").addEventListener("dragover",e=>{ const z=e.target.closest(".zone"); if(z&&dragId){ e.preventDefault(); document.querySelectorAll(".zone.dragover").forEach(x=>x.classList.remove("dragover")); z.classList.add("dragover"); }});
$("#zoneList").addEventListener("drop",e=>{ e.preventDefault(); const z=e.target.closest(".zone"); if(!z||!dragId) return;
  const to=state.order.indexOf(z.dataset.id); state.order.splice(state.order.indexOf(dragId),1); state.order.splice(to,0,dragId); dragId=null; renderAll(); });
$("#zoneList").addEventListener("dragend",()=>{ dragId=null; document.querySelectorAll(".zone.dragover").forEach(x=>x.classList.remove("dragover")); });

$("#btnExport").onclick=()=>{ const blob=new Blob([JSON.stringify({version:TRIP.version,plan:state},null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="sri-lanka-plan.json"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); };
$("#btnImport").onclick=()=>$("#fileIn").click();
$("#fileIn").onchange=e=>{ const f=e.target.files[0]; if(!f) return; f.text().then(t=>{ try{ const d=JSON.parse(t); state=Object.assign(defaults(), d.plan||d); renderAll(); }catch(err){ alert("This file isn’t a plan exported from this map."); } }); e.target.value=""; };
$("#btnReset").onclick=()=>{ if(confirm("Reset order, nights and selections to the defaults in this file?")){ state=defaults(); renderAll(); fit(); } };
function fit(){ const seq=includedOrder(); const pts=(seq.length?seq.map(id=>[Z[id].lat,Z[id].lng]):TRIP.zones.map(z=>[z.lat,z.lng])).concat([[TRIP.airport.lat,TRIP.airport.lng]]); map.fitBounds(L.latLngBounds(pts).pad(0.15)); }
$("#btnFit").onclick=fit;
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",renderAll);

renderAll(); fit();
</script>
</body>
</html>
